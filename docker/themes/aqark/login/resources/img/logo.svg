  <rect x="2" y="8" width="48" height="48" rx="12" fill="url(#g)" fill-opacity="0.25"/>
  <!-- buildings -->
  <rect x="14" y="24" width="9" height="22" rx="1.5" fill="#ffffff"/>
  <rect x="25" y="18" width="11" height="28" rx="1.5" fill="#ffffff"/>
  <rect x="38" y="29" width="8" height="17" rx="1.5" fill="#ffffff" fill-opacity="0.85"/>
