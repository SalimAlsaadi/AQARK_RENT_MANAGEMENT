  <text x="62" y="42" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="3" fill="#ffffff">AQARK</text>
  <defs>
    <linearGradient id="g" x1="2" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
