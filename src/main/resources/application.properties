# ============================================================
# SERVER
# ============================================================
server.port=8008
server.ssl.enabled=true

# Honour X-Forwarded-* from the Angular dev proxy so OAuth2 redirect URIs are built against the
# SPA origin (http://localhost:4200) and the login callback returns through the proxy — which is
# what lets the BFF session cookie land on the SPA origin.
server.forward-headers-strategy=framework

# Session cookie for the BFF/SPA. SameSite=None + Secure is required because the Angular
# dev origin (http://localhost:4200) is cross-scheme to the HTTPS backend (localhost:8008).
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# SSL keystore (same cert as Keycloak — generated by shared CA)
server.ssl.key-store=classpath:keystore/app-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=spring-app
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# ============================================================
# DATABASE (SQL Server)
# ============================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AQARK_RENT_MANAGEMENT;encrypt=true;trustServerCertificate=true
spring.datasource.username=app_root
spring.datasource.password=app_root
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.default_schema=dbo
# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO

# ============================================================
# OAUTH2 RESOURCE SERVER (JWT via Keycloak)
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://localhost:8443/realms/AQARK-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://localhost:8443/realms/AQARK-realm/protocol/openid-connect/certs

# ============================================================
# OAUTH2 CLIENT (Authorization code flow)
# ============================================================
spring.security.oauth2.client.registration.keycloak.client-id=spring-boot-app
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:change-me-in-keycloak-admin}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email,roles
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak

spring.security.oauth2.client.provider.keycloak.authorization-uri=https://localhost:8443/realms/AQARK-realm/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=https://localhost:8443/realms/AQARK-realm/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=https://localhost:8443/realms/AQARK-realm/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-info-uri=https://localhost:8443/realms/AQARK-realm/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub

# ============================================================
# KEYCLOAK CUSTOM PROPERTIES
# ============================================================
keycloak.client-id=spring-boot-app
keycloak.realm=AQARK-realm
keycloak.issuer-uri=https://localhost:8443/realms/AQARK-realm

# Admin REST API access used to provision users at self-registration (replaces the old SAS call).
# Dev default uses the admin-cli password grant; in prod prefer a service-account client with
# realm-management:manage-users and inject the credentials from the environment.
keycloak.base-url=https://localhost:8443
keycloak.target-realm=AQARK-realm
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=${KC_ADMIN:admin}
keycloak.admin.password=${KC_ADMIN_PASSWORD:admin_pass}
# Dev only: the mkcert root CA that signed Keycloak's cert, added to the JVM trust store so
# JWKS / token / userinfo / ID-token calls to Keycloak validate. Absent in prod (skipped).
keycloak.tls.ca-cert=file:docker/certs/mkcert-rootCA.pem

# ============================================================
# FRONTEND (Angular SPA) — where the backend redirects after login/logout
# ============================================================
app.frontend.url=http://localhost:4200

# ============================================================
# CORS
# ============================================================
cors.allowed-origins=https://localhost:8443,https://localhost:8008,http://localhost:4200

# ============================================================
# FILE UPLOAD CONFIG
# ============================================================
upload.directory=C:\\MyApps\\AQARK_RENT_MANAGEMENT\\Uploads
media.public-base-url=https://localhost:8008/api/media

folder.buildings=buildings
folder.building=building
folder.rooms=room
folder.flat=flat
folder.home=home

flat.link.src=https://localhost:8008/api/images/flat/
building.link.src=https://localhost:8008/api/images/buildings/
room.link.src=https://localhost:8008/api/images/room/

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.AQARK.AQARK_RENT_MANAGEMENT=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] [%X{userId}] %logger{36} - %msg%n
